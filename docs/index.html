<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMAO Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board-dark:#24312A;
    --board-dark-2:#2C3B32;
    --board-light:#F3ECD9;
    --ink:#1B241C;
    --ink-soft:#4A554C;
    --paper:#EFE7D2;
    --gold:#C79A3A;
    --gold-soft:rgba(199,154,58,.18);
    --line:rgba(255,255,255,.08);
    --line-light:rgba(27,36,28,.12);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--board-dark);
    background-image:
      linear-gradient(var(--board-dark-2), var(--board-dark-2)),
      repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0, rgba(255,255,255,.015) 2px, transparent 2px, transparent 40px);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:56px 20px 80px;
  }

  header{
    margin-bottom:36px;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2.2rem, 5vw, 3rem);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  .sub{
    font-size:1rem;
    color:#B9C2B7;
    margin:0;
    max-width:52ch;
    line-height:1.5;
  }

  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    margin-top:28px;
  }

  .switch{
    display:inline-flex;
    background:rgba(0,0,0,.22);
    border:1px solid var(--line);
    border-radius:8px;
    padding:3px;
  }

  .switch button{
    font-family:'Inter',sans-serif;
    font-size:.92rem;
    font-weight:500;
    color:#AEB8AC;
    background:transparent;
    border:none;
    padding:8px 18px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }

  .switch button.active{
    background:var(--paper);
    color:var(--ink);
  }

  .search{
    flex:1;
    min-width:180px;
  }

  .search input{
    width:100%;
    background:rgba(0,0,0,.22);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 14px;
    color:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:.92rem;
  }

  .search input::placeholder{ color:#7E897C; }
  .search input:focus{ outline:1px solid var(--gold); outline-offset:0; }

  .panel{
    margin-top:28px;
    background:var(--paper);
    border-radius:10px;
    overflow:hidden;
    color:var(--ink);
  }

  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:16px 20px;
    border-bottom:1px solid var(--line-light);
  }

  .panel-head .label{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
  }

  .panel-head .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:.82rem;
    color:var(--ink-soft);
  }

  .viewport{
    height:560px;
    overflow-y:auto;
    position:relative;
    -webkit-overflow-scrolling:touch;
  }

  .spacer{
    position:relative;
    width:100%;
  }

  .list{
    position:relative;
    width:100%;
  }

  .row{
    position:absolute;
    left:0;
    right:0;
    display:grid;
    grid-template-columns:44px 1fr auto;
    align-items:center;
    gap:14px;
    padding:0 20px;
    border-bottom:1px solid var(--line-light);
    cursor:pointer;
  }

  .row:hover{ background:rgba(199,154,58,.08); }

  .row.even{ background:rgba(36,49,42,.045); }
  .row.even:hover{ background:rgba(199,154,58,.1); }

  .row.top{ background:var(--gold-soft); }
  .row.top:hover{ background:rgba(199,154,58,.26); }

  .rank{
    font-family:'IBM Plex Mono',monospace;
    font-size:.95rem;
    color:var(--ink-soft);
  }

  .row.top .rank{ color:var(--gold); font-weight:600; }

  .name{
    font-size:.98rem;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .points{
    font-family:'IBM Plex Mono',monospace;
    font-size:.98rem;
    font-weight:600;
    text-align:right;
    white-space:nowrap;
  }

  .detail{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    gap:14px 16px;
  }

  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,20,16,.6);
    align-items:flex-start;
    justify-content:center;
    padding:10vh 20px;
    z-index:50;
  }

  .overlay.open{ display:flex; }

  .overlay-card{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:12px;
    padding:26px 24px 24px;
    max-width:480px;
    width:100%;
    max-height:70vh;
    overflow-y:auto;
  }

  .overlay-close{
    position:absolute;
    top:14px;
    right:14px;
    background:transparent;
    border:none;
    font-size:1.1rem;
    color:var(--ink-soft);
    cursor:pointer;
    line-height:1;
    padding:4px;
  }

  .overlay-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:2px;
    padding-right:24px;
  }

  .overlay-rank{
    font-family:'IBM Plex Mono',monospace;
    color:var(--gold);
    font-weight:600;
  }

  .overlay-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.3rem;
  }

  .overlay-points{
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    font-size:.9rem;
    margin-bottom:18px;
  }

  .stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .stat .stat-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--ink-soft);
  }

  .stat .stat-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:.95rem;
    font-weight:600;
    color:var(--ink);
  }

  .stat .stat-value.pos{ color:#3E7A4C; }
  .stat .stat-value.neg{ color:#B5473A; }

  @media (max-width:480px){
    .detail{ grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); }
  }

  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:.92rem;
  }

  footer{
    margin-top:26px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    color:#8A9488;
  }

  footer a{ color:#B9C2B7; }

  @media (max-width:480px){
    .row{ grid-template-columns:34px 1fr auto; gap:10px; padding:0 16px; }
    .panel-head{ padding:14px 16px; }
    .viewport{ height:70vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LMAO Standings</h1>
    <p class="sub">All LMAO Day and LMAO Night tournaments combined, points summed across every edition. Klicke auf eine Zeile für mehr Stats.</p>
    <div class="controls">
      <div class="switch">
        <button id="btn-teams" class="active">Teams</button>
        <button id="btn-players">Players</button>
      </div>
      <div class="search">
        <input id="search" type="text" placeholder="Search...">
      </div>
    </div>
  </header>

  <div class="panel">
    <div class="panel-head">
      <span class="label" id="panel-label">Team Standings</span>
      <span class="count" id="panel-count"></span>
    </div>
    <div id="viewport" class="viewport">
      <div id="spacer" class="spacer">
        <div id="list" class="list"></div>
      </div>
    </div>
  </div>

  <footer>
    <span id="updated">Loading...</span>
    <span id="tournaments"></span>
  </footer>
</div>

<div id="overlay" class="overlay">
  <div id="overlay-card" class="overlay-card">
    <button id="overlay-close" class="overlay-close">✕</button>
    <div class="overlay-head">
      <span class="overlay-rank" id="overlay-rank"></span>
      <span class="overlay-name" id="overlay-name"></span>
    </div>
    <div class="overlay-points" id="overlay-points"></div>
    <div id="overlay-stats" class="detail"></div>
  </div>
</div>

<script>
  const DATA_URL = {
    teams: 'data/leaderboard_teams.json',
    players: 'data/leaderboard_players.json',
    meta: 'data/meta.json',
  };

  const ROW_HEIGHT = 49;   // px, muss zur CSS-Zeilenhoehe passen
  const OVERSCAN = 8;      // zusaetzliche Zeilen ausserhalb des Viewports gerendert

  const state = {
    view: 'teams',
    teams: [],
    players: [],
    teamsTotal: 0,
    playersTotal: 0,
    query: '',
    loadingTeams: false,
    loadingPlayers: false,
    filtered: [],       // aktuell gefilterte+sortierte Liste fuer die aktive View
  };

  // Zusatz-Statistiken, die aggregate.py aus den Turnier-Einzelergebnissen
  // berechnet. Alle Felder sind optional — fehlt eines (z.B. weil ein
  // Team-Battle keine Ranks liefert), wird die Kachel einfach weggelassen.
  const STAT_DEFS = [
    { key: 'tournaments_played',      label: 'Turniere',         fmt: v => `${v}` },
    { key: 'best_tournament',         label: 'Bestes Turnier',   fmt: v => `${v}` },
    { key: 'best_tournament_score',   label: 'Score dort',       fmt: v => `${v}` },
    { key: 'best_finish',             label: 'Beste Platzierung',fmt: v => `#${v}` },
    { key: 'worst_finish',            label: 'Schlechteste Platz.', fmt: v => `#${v}` },
    { key: 'avg_finish',              label: 'Ø Platzierung',    fmt: v => `#${v}` },
    { key: 'avg_points',              label: 'Ø Punkte',         fmt: v => `${v}` },
    { key: 'highest_points',          label: 'Höchster Score',   fmt: v => `${v}` },
    { key: 'podiums',                 label: 'Podestplätze',     fmt: v => `${v}` },
    { key: 'first_places',            label: 'Siege',            fmt: v => `${v}` },
    { key: 'top3_rate',               label: 'Top-3-Quote',      fmt: v => `${(v * 100).toFixed(1)}%` },
    { key: 'active_since',            label: 'Aktiv seit',       fmt: v => fmtDate(v) || `${v}` },
    { key: 'last_played',             label: 'Zuletzt gespielt', fmt: v => fmtDate(v) || `${v}` },
    { key: 'team_name',               label: 'Team',             fmt: v => `${v}`, playersOnly:true },
  ];

  const el = {
    btnTeams: document.getElementById('btn-teams'),
    btnPlayers: document.getElementById('btn-players'),
    search: document.getElementById('search'),
    viewport: document.getElementById('viewport'),
    spacer: document.getElementById('spacer'),
    list: document.getElementById('list'),
    label: document.getElementById('panel-label'),
    count: document.getElementById('panel-count'),
    updated: document.getElementById('updated'),
    tournaments: document.getElementById('tournaments'),
    overlay: document.getElementById('overlay'),
    overlayCard: document.getElementById('overlay-card'),
    overlayClose: document.getElementById('overlay-close'),
    overlayRank: document.getElementById('overlay-rank'),
    overlayName: document.getElementById('overlay-name'),
    overlayPoints: document.getElementById('overlay-points'),
    overlayStats: document.getElementById('overlay-stats'),
  };

  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleString('en-US', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Neu berechnen, welche Zeilen fuer die aktuelle View + Suche relevant sind.
  // Wird nur bei Tab-Wechsel, neuen Daten oder neuer Suche aufgerufen — NICHT beim Scrollen.
  function recomputeFiltered(){
    const isTeams = state.view === 'teams';
    const data = isTeams ? state.teams : state.players;
    const q = state.query.trim().toLowerCase();
    state.filtered = q
      ? data.filter(row => (isTeams ? row.team_name : row.username).toLowerCase().includes(q))
      : data;
  }

  // Rendert nur das Fenster von Zeilen, das gerade im sichtbaren Bereich liegt.
  // Wird beim Scrollen (throttled per rAF) aufgerufen — bleibt konstant schnell,
  // egal ob die Liste 50 oder 50.000 Eintraege hat.
  function renderWindow(){
    const isTeams = state.view === 'teams';
    const data = state.filtered;
    const total = data.length;

    el.spacer.style.height = `${total * ROW_HEIGHT}px`;

    const scrollTop = el.viewport.scrollTop;
    const viewportH = el.viewport.clientHeight || 560;
    let startIdx = Math.floor(scrollTop / ROW_HEIGHT) - OVERSCAN;
    let endIdx = Math.ceil((scrollTop + viewportH) / ROW_HEIGHT) + OVERSCAN;
    startIdx = Math.max(0, startIdx);
    endIdx = Math.min(total, endIdx);

    const frag = document.createDocumentFragment();
    for(let i = startIdx; i < endIdx; i++){
      const row = data[i];
      const name = isTeams ? row.team_name : row.username;
      const rank = row.rank;
      const isTop = rank <= 3;
      const div = document.createElement('div');
      div.className = `row${isTop ? ' top' : ''}${i % 2 === 1 ? ' even' : ''}`;
      div.style.top = `${i * ROW_HEIGHT}px`;
      div.style.height = `${ROW_HEIGHT}px`;
      div.dataset.idx = String(i);
      div.innerHTML = `<span class="rank">${rank}</span>
        <span class="name">${escapeHtml(name)}</span>
        <span class="points">${row.points}</span>`;
      frag.appendChild(div);
    }
    el.list.replaceChildren(frag);
  }

  function openOverlay(row, isTeams){
    const name = isTeams ? row.team_name : row.username;
    el.overlayRank.textContent = `#${row.rank}`;
    el.overlayName.textContent = name;
    el.overlayPoints.textContent = `${row.points} points`;

    const stats = STAT_DEFS
      .filter(def => {
        if(def.playersOnly && isTeams) return false;
        if(def.teamsOnly && !isTeams) return false;
        const v = row[def.key];
        return v !== undefined && v !== null && v !== '';
      })
      .map(def => {
        const v = row[def.key];
        return `<div class="stat">
          <span class="stat-label">${escapeHtml(def.label)}</span>
          <span class="stat-value">${escapeHtml(def.fmt(v))}</span>
        </div>`;
      }).join('');

    el.overlayStats.innerHTML = stats || `<div class="stat"><span class="stat-value" style="color:var(--ink-soft);font-weight:500;">Keine weiteren Stats verfügbar.</span></div>`;
    el.overlay.classList.add('open');
  }

  function closeOverlay(){
    el.overlay.classList.remove('open');
  }

  // Klick-Delegation statt pro-Zeile-Listener: nur EIN Listener,
  // egal wie viele Zeilen es insgesamt gibt.
  el.list.addEventListener('click', e => {
    const rowEl = e.target.closest('.row[data-idx]');
    if(!rowEl) return;
    const idx = Number(rowEl.dataset.idx);
    const row = state.filtered[idx];
    if(row) openOverlay(row, state.view === 'teams');
  });

  el.overlayClose.addEventListener('click', closeOverlay);
  el.overlay.addEventListener('click', e => { if(e.target === el.overlay) closeOverlay(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeOverlay(); });

  // Scroll-Handler per requestAnimationFrame throttled, damit bei
  // schnellem Scrollen nicht mehrfach pro Frame gerendert wird.
  let scrollScheduled = false;
  el.viewport.addEventListener('scroll', () => {
    if(scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(() => {
      renderWindow();
      scrollScheduled = false;
    });
  });

  function render(){
    const isTeams = state.view === 'teams';
    el.btnTeams.classList.toggle('active', isTeams);
    el.btnPlayers.classList.toggle('active', !isTeams);
    el.label.textContent = isTeams ? 'Team Standings' : 'Player Standings';

    const isLoading = isTeams ? state.loadingTeams : state.loadingPlayers;
    const rawData = isTeams ? state.teams : state.players;

    if(isLoading && rawData.length === 0){
      el.count.textContent = '';
      el.spacer.style.height = '0px';
      el.list.innerHTML = '<div class="empty" style="position:static;">Lädt…</div>';
      return;
    }

    recomputeFiltered();

    const total = isTeams ? state.teamsTotal : state.playersTotal;
    const dataLen = rawData.length;
    el.count.textContent = (total > dataLen)
      ? `${state.filtered.length} of ${dataLen} shown (top ${dataLen} of ${total} total)`
      : `${state.filtered.length} of ${dataLen}`;

    if(state.filtered.length === 0){
      el.spacer.style.height = '0px';
      el.list.innerHTML = '<div class="empty" style="position:static;">No matches.</div>';
      return;
    }

    el.viewport.scrollTop = 0;
    renderWindow();
  }

  async function loadJson(url){
    try{
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) return [];
      return await res.json();
    }catch(e){
      return [];
    }
  }

  function init(){
    // Meta ist klein → separat und sofort laden, blockiert nichts anderes
    loadJson(DATA_URL.meta).then(meta => {
      if(meta && meta.generated_at){
        el.updated.textContent = `Last updated: ${fmtDate(meta.generated_at)}`;
      }else{
        el.updated.textContent = 'Last updated: unknown';
      }
      if(meta && typeof meta.tournaments_processed === 'number'){
        el.tournaments.textContent = `${meta.tournaments_processed} tournaments processed`;
      }
      if(meta && typeof meta.teams_count === 'number') state.teamsTotal = meta.teams_count;
      if(meta && typeof meta.players_count === 'number') state.playersTotal = meta.players_count;
      render();
    });

    // Teams unabhängig von Players laden, damit ein langsamer/großer
    // Players-Request nicht die komplette Seite blockiert
    state.loadingTeams = true;
    render();
    loadJson(DATA_URL.teams).then(teams => {
      state.teams = Array.isArray(teams) ? teams : [];
      if(!state.teamsTotal) state.teamsTotal = state.teams.length;
      state.loadingTeams = false;
      render();
    });

    // Players separat und parallel laden
    state.loadingPlayers = true;
    loadJson(DATA_URL.players).then(players => {
      state.players = Array.isArray(players) ? players : [];
      if(!state.playersTotal) state.playersTotal = state.players.length;
      state.loadingPlayers = false;
      render();
    });
  }

  el.btnTeams.addEventListener('click', () => { state.view = 'teams'; render(); });
  el.btnPlayers.addEventListener('click', () => { state.view = 'players'; render(); });

  let searchDebounce;
  el.search.addEventListener('input', e => {
    clearTimeout(searchDebounce);
    const val = e.target.value;
    searchDebounce = setTimeout(() => {
      state.query = val;
      render();
    }, 120);
  });

  init();
</script>
</body>
</html>
